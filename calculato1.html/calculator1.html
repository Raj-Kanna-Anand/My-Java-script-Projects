<body>
    <section id="A">
        <h1>Calculator</h1>
        <div class="display" id="display">0</div>
        <div class="display" id="display1"></div>
        <button onclick="dddd('1')">1</button>
        <button onclick="dddd('2')">2</button>
        <button onclick="dddd('3')">3</button>
        <button onclick="dddd('4')">4</button>
        <button onclick="dddd('5')">5</button>
        <button onclick="dddd('6')">6</button>
        <button onclick="dddd('7')">7</button>
        <button onclick="dddd('8')">8</button>
        <button onclick="dddd('9')">9</button>

        <button onclick="reset()">AC</button>
        <button onclick="op('+')" class="HH">+</button>
        <button onclick="op('-')" class="HH">-</button>
        <button onclick="op('*')" class="HH">*</button>
        <button onclick="op('/')" class="HH">/</button>
        <button onclick="op('%')" class="HH">%</button>
        <button onclick="operator98()">=</button>
        
    </section>
